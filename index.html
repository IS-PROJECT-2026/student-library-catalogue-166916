<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Library Catalogue</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Student Library Catalogue</h1>
        <p>Find available books for students.</p>
    </header>

    <main>
        <section id="catalogue">
            <h2>Book Catalogue</h2>

            <div class="search-container">

                <input
                    type="text"
                    id="search-input"
                    placeholder="Search by title, author, or category..."
                    aria-label="Search books"
                >

                <select
                    id="category-filter"
                    aria-label="Filter books by category"
                >
                    <option value="all">All Categories</option>
                    <option value="Information Ethics">Information Ethics</option>
                    <option value="Archives">Archives</option>
                    <option value="Research Methods">Research Methods</option>
                    <option value="Library Management">Library Management</option>
                    <option value="Information Law">Information Law</option>
                    <option value="Information Policy">Information Policy</option>
                    <option value="Knowledge Organization">Knowledge Organization</option>
                    <option value="Copyright">Copyright</option>
                    <option value="Metadata">Metadata</option>
                </select>

            </div>

            <!-- Favorites Controls -->
            <div class="favourites-controls">

                <button
                    id="all-books-button"
                    class="filter-button active"
                >
                    All Books
                </button>

                <button
                    id="favorites-button"
                    class="filter-button"
                >
                    ❤️ Favorites
                </button>

            </div>

            <div id="book-list"></div>

        </section>


        <!-- Book Details Modal -->
        <div id="book-details" class="book-details hidden">

            <div class="details-content">

                <button
                    id="close-details"
                    class="close-details"
                    aria-label="Close book details"
                >
                    &times;
                </button>

                <div class="details-cover">
                    <span>BOOK</span>
                </div>

                <div class="details-info">

                    <h2 id="details-title"></h2>

                    <p
                        id="details-author"
                        class="details-author"
                    ></p>

                    <p
                        id="details-category"
                        class="details-category"
                    ></p>

                    <h3>Description</h3>

                    <p id="details-description"></p>

                    <p id="details-availability"></p>

                    <div id="details-actions"></div>

                </div>

            </div>

        </div>

    </main>

    <script src="js/script.js"></script>

</body>
</html>
